<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Visor de nube de puntos</title>
<link rel="stylesheet" href="/potree-lib/build/potree/potree.css">
<link rel="stylesheet" href="/potree-lib/libs/jquery-ui/jquery-ui.min.css">
<link rel="stylesheet" href="/potree-lib/libs/openlayers3/ol.css">
<link rel="stylesheet" href="/potree-lib/libs/spectrum/spectrum.css">
<link rel="stylesheet" href="/potree-lib/libs/jstree/themes/mixed/style.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  #potree_render_area { background: #001; }
</style>
</head>
<body>
  <div class="potree_container" style="position:absolute;width:100%;height:100%;left:0;top:0;">
    <div id="potree_render_area"></div>
    <div id="potree_sidebar_container"></div>
  </div>

<!--
  NOTA: estos nombres/rutas de libs siguen la estructura tipica de los
  examples/*.html del repo potree/potree en la version 1.8.2. Si al abrir esta
  pagina la consola muestra 404 en algun script, compara con el archivo
  examples/viewer_template.html del repo que se clona en el build del
  Dockerfile y ajusta las rutas aqui abajo.
-->
<script src="/potree-lib/libs/jquery/jquery-3.1.1.min.js"></script>
<script src="/potree-lib/libs/spectrum/spectrum.js"></script>
<script src="/potree-lib/libs/jquery-ui/jquery-ui.min.js"></script>
<script src="/potree-lib/libs/other/BinaryHeap.js"></script>
<script src="/potree-lib/libs/tween/tween.min.js"></script>
<script src="/potree-lib/libs/d3/d3.js"></script>
<script src="/potree-lib/libs/proj4/proj4.js"></script>
<script src="/potree-lib/libs/openlayers3/ol.js"></script>
<script src="/potree-lib/libs/i18next/i18next.js"></script>
<script src="/potree-lib/libs/jstree/jstree.js"></script>
<script src="/potree-lib/build/potree/potree.js"></script>
<script src="/potree-lib/libs/plasio/js/laslaz.js"></script>

<script type="module">
  const params = new URLSearchParams(window.location.search);
  const jobId = params.get('job');

  if (!jobId) {
    document.body.innerHTML = '<p style="color:white;padding:20px">Falta el parametro ?job=ID en la URL</p>';
  } else {
    window.viewer = new Potree.Viewer(document.getElementById('potree_render_area'));
    viewer.setEDLEnabled(true);
    viewer.setFOV(60);
    viewer.setPointBudget(2_000_000);
    viewer.setDescription('Nube de puntos generada');
    viewer.loadGUI(() => {
      viewer.setLanguage('es');
    });

    // "pointclouds" es el bucket de MinIO, proxied por nginx en /pointclouds/
    const url = `/pointclouds/${jobId}/metadata.json`;

    Potree.loadPointCloud(url, 'nube', (e) => {
      const pointcloud = e.pointcloud;
      const material = pointcloud.material;
      material.activeAttributeName = 'rgba';
      material.pointSizeType = Potree.PointSizeType.ADAPTIVE;

      viewer.scene.addPointCloud(pointcloud);
      viewer.fitToScreen();
    });
  }
</script>
</body>
</html>
