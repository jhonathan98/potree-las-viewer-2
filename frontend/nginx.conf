client_max_body_size 0;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Libreria de Potree (three.js, potree.js, css, etc.)
    location /potree-lib/ {
        alias /usr/share/nginx/html/potree-lib/;
    }

    # Proxy hacia la API, sin bufferizar para permitir subidas grandes en streaming
    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy hacia el bucket publico de MinIO donde viven las nubes convertidas.
    # El nombre del bucket "pointclouds" coincide con el prefijo de la ruta a proposito.
    location /pointclouds/ {
        proxy_pass http://minio:9000/pointclouds/;
        proxy_http_version 1.1;
        proxy_buffering off;
    }

    # Proxy hacia el bucket privado "raw-las": el navegador sube el LAS/LAZ
    # aqui directo con una URL prefirmada (generada por la API), sin pasar
    # por el proceso de la API. nginx no reescribe el Host, asi que llega a
    # MinIO igual que si el cliente hubiera pegado contra "minio:9000"
    # directamente (que es el host con el que la API firmo la URL). MinIO
    # rechaza cualquier request sin firma valida, asi que este proxy no
    # habilita acceso de escritura anonimo al bucket.
    location /raw-las/ {
        proxy_pass http://minio:9000/raw-las/;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
