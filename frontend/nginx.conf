client_max_body_size 0;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Libreria de Potree (three.js, potree.js, css, etc.)
    location /potree-lib/ {
        alias /usr/share/nginx/html/potree-lib/;
    }

    # Proxy hacia la API, sin bufferizar para permitir subidas grandes en streaming
    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Proxy hacia el bucket publico de MinIO donde viven las nubes convertidas.
    # El nombre del bucket "pointclouds" coincide con el prefijo de la ruta a proposito.
    location /pointclouds/ {
        proxy_pass http://minio:9000/pointclouds/;
        proxy_http_version 1.1;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
